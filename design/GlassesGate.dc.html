<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lens card: safety gate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#000;color:#fff}
a{color:#F5B82E}a:hover{color:#FFD166}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; color: #F5B82E; letter-spacing: 0.5px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/></svg>SAFETY GATE</span>
    <span style="font-size: 22px; font-weight: 600; color: #B8BDC7">before step 1</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px">
    <div style="font-size: 44px; line-height: 1.12; font-weight: 700; letter-spacing: -0.6px">Show me the plug is out of the wall</div>
    <div style="font-size: 26px; line-height: 1.3; font-weight: 500; color: #D5D9E0">Keep the plug and the outlet both in view</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; color: #2DD4BF"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>Say "done"</span>
    <span style="display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; color: #B8BDC7"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a2 2 0 1 1 4 0v6"/><path d="M12 11V8a2 2 0 1 1 4 0v4"/><path d="M16 12a2 2 0 1 1 4 0v3a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L5 14a2 2 0 1 1 3-2.4l0 1.4"/></svg>or pinch</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
