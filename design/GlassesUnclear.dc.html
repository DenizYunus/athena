<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lens card: need a better look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#000;color:#fff}
a{color:#F5B82E}a:hover{color:#FFD166}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; color: #60A5FA; letter-spacing: 0.5px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>NEED A BETTER LOOK</span>
    <span style="font-size: 22px; font-weight: 600; color: #B8BDC7">step 4</span>
  </div>

  <div style="display: flex; gap: 28px; align-items: center">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
      <div style="font-size: 42px; line-height: 1.12; font-weight: 700; letter-spacing: -0.6px">Move your hand, then look up from below</div>
      <div style="font-size: 26px; line-height: 1.3; font-weight: 500; color: #D5D9E0">I need to see all three pins</div>
    </div>
    <div style="width: 150px; height: 150px; border-radius: 75px; background: #10243A; border: 3px solid #60A5FA; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
      <svg width="90" height="90" viewBox="0 0 90 90" role="img" aria-label="Tilt head down and look up"><rect x="27" y="14" width="36" height="24" rx="5" fill="#2B303A" stroke="#C9CED8" stroke-width="2"/><path d="M45 78V48" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/><path d="M31 60l14-14 14 14" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; color: #2DD4BF"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hold still · capturing in 2 s</span>
    <span style="font-size: 22px; font-weight: 600; color: #B8BDC7">"skip"</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
