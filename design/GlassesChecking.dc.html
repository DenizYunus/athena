<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lens card: checking a step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#000;color:#fff}
a{color:#F5B82E}a:hover{color:#FFD166}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 24px; font-weight: 600; color: #B8BDC7; letter-spacing: 0.5px">STEP 4 OF 7</span>
    <span style="font-size: 22px; font-weight: 600; color: #F5B82E">photo taken</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center">
    <span style="width: 96px; height: 96px; border-radius: 48px; border: 8px solid #2A2F38; border-top-color: #F5B82E; box-sizing: border-box" aria-hidden="true"></span>
    <div style="font-size: 44px; line-height: 1.12; font-weight: 700; letter-spacing: -0.6px">Checking…</div>
    <div style="font-size: 26px; line-height: 1.3; font-weight: 500; color: #D5D9E0">Comparing with Marco's photo. Keep your hands where they are.</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: #B8BDC7">usually 3 to 5 seconds</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
